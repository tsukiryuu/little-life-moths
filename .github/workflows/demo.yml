name: Public boundary demo
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run demo tests
        run: cd demo && python -m unittest discover -v
      - name: Verify deliberately broken control
        run: cd demo && python scope_nonspillover.py
